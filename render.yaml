services:
  - type: web
    name: southbi-ml-api
    runtime: python
    plan: free
    buildCommand: pip install -r services/ml-api/requirements.txt
    startCommand: PYTHONPATH=. uvicorn main:app --app-dir services/ml-api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MODEL_PATH
        value: models/salary_champion.joblib
      - key: FEATURE_SPEC_PATH
        value: models/feature_spec.json
      - key: ML_API_KEY
        sync: false
